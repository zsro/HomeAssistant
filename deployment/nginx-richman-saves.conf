# Include inside EACH public server {} in home-assistant.conf when releasing
# SAVE-02. Do not include at http {} level. nginx -t before reloading.
# This overrides the default 1 MiB request limit only for Richman save endpoints.
location ^~ /api/v1/richman/saves {
    client_max_body_size 9m;
    client_body_timeout 30s;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;
}
